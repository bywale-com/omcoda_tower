<!DOCTYPE html>
<html>
    <head>
        <title>Testing Flex</title>
        <style>
            .container{
                display: flex;
                flex-direction: row;
                background-color: blue;
                padding: 100px;
            }

            .container > div:last-child{
                border-right: 1px dotted blueviolet;

            }
            .container > div{
                padding: 20px;
                width: 100%;
                border: 1px dotted blueviolet;
                border-right: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div>This is Box 1</div>
            <div>This is Box 2</div>
            <div>This is Box 3</div>
            <div>This is Box 4</div>
        </div>
    </body>
</html>
