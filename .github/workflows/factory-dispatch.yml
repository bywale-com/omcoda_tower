# Tower factory dispatch.
# This workflow does not listen to pull requests, pushes, or a schedule.
# workflow_dispatch simulate runs the deterministic check.
# workflow_dispatch apply adds a label only when every disarm gate passes
# and the ledger carries a positive authorizedDispatches count.
# Those gates are unset in this repository. Apply exits before gh.

name: Factory dispatch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "simulate or apply"
        required: true
        default: simulate
        type: choice
        options:
          - simulate
          - apply
      authorize:
        description: "Required only for apply: I_AUTHORIZE_FACTORY_DISPATCH"
        required: false
        default: ""
        type: string
      pr:
        description: "Pull request number. Required only when apply is fully armed."
        required: false
        default: ""
        type: string
      pr_head:
        description: "Pull request head SHA. Required only when apply is fully armed."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simulate or refuse
        env:
          MODE: ${{ inputs.mode }}
          AUTHORIZE: ${{ inputs.authorize }}
          FACTORY_CONTROLLER: ${{ vars.FACTORY_CONTROLLER }}
          FACTORY_LABELS: ${{ vars.FACTORY_LABELS }}
          FACTORY_SPEND_LIMIT_CONFIRMED: ${{ vars.FACTORY_SPEND_LIMIT_CONFIRMED }}
          FACTORY_AUTOMATIONS_SAVED: ${{ vars.FACTORY_AUTOMATIONS_SAVED }}
          WAKE_GITHUB_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN }}
          FACTORY_PR: ${{ inputs.pr }}
          FACTORY_PR_HEAD: ${{ inputs.pr_head }}
          FACTORY_REPOSITORY: ${{ github.repository }}
          FACTORY_LEDGER_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$MODE" != "apply" ]; then
            echo "mode=simulate. No labels. No agents."
            npm run factory:check
            exit 0
          fi
          if [ "$AUTHORIZE" != "I_AUTHORIZE_FACTORY_DISPATCH" ]; then
            echo "apply refused: authorization phrase does not match."
            exit 1
          fi
          if [ "$FACTORY_CONTROLLER" != "active" ]; then
            echo "apply refused: repository variable FACTORY_CONTROLLER is not active."
            exit 1
          fi
          if [ "$FACTORY_LABELS" != "armed" ] || [ "$FACTORY_SPEND_LIMIT_CONFIRMED" != "yes" ] || [ "$FACTORY_AUTOMATIONS_SAVED" != "yes" ] || [ -z "${WAKE_GITHUB_TOKEN}" ]; then
            echo "actuator disarmed: spending limit or Cursor automations are not confirmed. No labels were added."
            exit 1
          fi
          npx tsx scripts/factory-dispatch-apply.ts
