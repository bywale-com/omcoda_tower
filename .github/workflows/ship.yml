# Hosted CI gate — every push/PR to main. Red blocks merge.
# Runs verify:ship (+ affordances + worker dry path) against ephemeral Postgres.
name: ship

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ship:
    name: verify:ship (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tower"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tower
      SEND_MODE: dry_run
      SEND_TEST_COHORT: ""
      AUTH_DISABLED: "true"
      VITE_AUTH_DISABLED: "true"
      DEV_SESSION_FIRM: firm-cedar
      VITE_DEV_FIRM_ID: firm-cedar
      VITE_WIRE_REAL: "true"
      VERIFY_LIVE_SEND: "0"
      WORKER_INTERVAL_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Write .env for tsx --env-file scripts
        run: |
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          SEND_MODE=${SEND_MODE}
          SEND_TEST_COHORT=
          AUTH_DISABLED=true
          VITE_AUTH_DISABLED=true
          DEV_SESSION_FIRM=${DEV_SESSION_FIRM}
          VITE_DEV_FIRM_ID=${VITE_DEV_FIRM_ID}
          VITE_WIRE_REAL=true
          VERIFY_LIVE_SEND=0
          WORKER_INTERVAL_MS=60000
          DEPLOY_STRICT=0
          EOF

      - name: Migrate
        run: npm run db:migrate

      - name: Seed
        run: npm run db:seed

      - name: Restore channel order (seed hygiene)
        run: npx tsx --env-file=.env scripts/restore-channel-order.ts

      - name: verify:ship (spine + deny gates)
        run: npm run verify:ship

      - name: verify:click-attribution (PKT-001)
        run: npx tsx --env-file=.env scripts/verify-click-attribution.ts

      - name: verify:audit-row-grain (PKT-005)
        run: npx tsx --env-file=.env scripts/verify-audit-row-grain.ts

      - name: verify:open-ask-cursor (PKT-002)
        run: npx tsx --env-file=.env scripts/verify-open-ask-cursor.ts

      - name: verify:resume-same-run (PKT-003)
        run: npx tsx --env-file=.env scripts/verify-resume-same-run.ts

      - name: verify:firing-handle (PKT-004)
        run: npx tsx --env-file=.env scripts/verify-firing-handle.ts

      - name: verify:affordances (chosen-value round-trip)
        run: npm run verify:affordances

      - name: verify:session-firm (wrong-tenant / no-session)
        run: npm run verify:session-firm

      - name: verify:boot-env (fail-closed defaults)
        run: npm run verify:boot-env

      - name: verify:worker (escalation + idempotent; no live ESP)
        run: npm run verify:worker

      - name: Build SPA
        run: npm run build
