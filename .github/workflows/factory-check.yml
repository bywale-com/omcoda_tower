# Deterministic factory check. No Cursor agent. No labels. No secrets.
name: Factory check

on:
  pull_request:
    paths:
      - ".factory/**"
      - "scripts/factory-check.ts"
      - "docs/factory/**"
      - ".github/workflows/factory-check.yml"
      - ".github/workflows/factory-dispatch.yml"
      - "server/wire-service/webhooks.ts"
      - "server/wire-service/campaignHousing.ts"
      - "server/wire-service/contactSeat.ts"
      - "server/wire-service/workflowWalk.ts"
      - "server/wire-service/cascade.ts"
      - "server/wire-service/runWrites.ts"
      - "server/wire-service/auditRun.ts"
      - "server/wire-service/machine.ts"
      - "server/wire-service/eventTest.ts"
      - "scripts/verify-click-attribution.ts"
      - "scripts/verify-open-ask-cursor.ts"
      - "scripts/verify-resume-same-run.ts"
      - "scripts/verify-firing-handle.ts"
      - "scripts/verify-id-keyed-loads.ts"
      - "scripts/verify-audit-row-grain.ts"
      - "supabase/migrations/025_audit_row_grain.sql"
      - "scripts/close-walk-gaps.ts"
      - "scripts/verify-automations-alive.ts"
      - "scripts/verify-machine-e2e.ts"
      - "scripts/verify-ship-spine.ts"
      - "scripts/factory-dispatch-apply.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run factory:check
